<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="t d">
  <title id="t">Pedestrian route planning flow</title><desc id="d">Selection, optional exact optimization, Valhalla route and OpenLayers rendering.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#64748b"/></marker><style>.h{font:700 24px system-ui;fill:#172554}.s{font:600 15px system-ui;fill:#334155}.n{font:500 12px system-ui;fill:#475569}.l{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="600" fill="#f8fafc"/><text x="55" y="55" class="h">Pedestrian Route Planning and Navigation</text>
  <g transform="translate(45 140)"><rect width="220" height="130" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="110" y="42" text-anchor="middle" class="s">Select origin + 2–8</text><text x="110" y="68" text-anchor="middle" class="s">popup destinations</text><text x="110" y="100" text-anchor="middle" class="n">preserve explicit order</text></g>
  <g transform="translate(330 140)"><rect width="240" height="130" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="120" y="42" text-anchor="middle" class="s">Optional optimizer</text><text x="120" y="68" text-anchor="middle" class="n">Valhalla matrix</text><text x="120" y="93" text-anchor="middle" class="n">Held–Karp open route</text></g>
  <g transform="translate(640 140)"><rect width="240" height="130" rx="20" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="120" y="42" text-anchor="middle" class="s">Backend route proxy</text><text x="120" y="68" text-anchor="middle" class="n">pedestrian costing</text><text x="120" y="93" text-anchor="middle" class="n">timeout / safe errors</text></g>
  <g transform="translate(950 140)"><rect width="220" height="130" rx="20" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/><text x="110" y="42" text-anchor="middle" class="s">Valhalla route</text><text x="110" y="68" text-anchor="middle" class="n">leg polyline6 shape</text><text x="110" y="93" text-anchor="middle" class="n">maneuvers + metrics</text></g>
  <g transform="translate(1235 140)"><rect width="220" height="130" rx="20" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><text x="110" y="42" text-anchor="middle" class="s">Decode and merge</text><text x="110" y="68" text-anchor="middle" class="n">full [lon, lat] shape</text><text x="110" y="93" text-anchor="middle" class="n">no straight fallback</text></g>
  <path d="M265 205 H330" class="l"/><path d="M570 205 H640" class="l"/><path d="M880 205 H950" class="l"/><path d="M1170 205 H1235" class="l"/>
  <g transform="translate(950 390)"><rect width="250" height="120" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="125" y="42" text-anchor="middle" class="s">OpenLayers route source</text><text x="125" y="68" text-anchor="middle" class="n">4326 → 3857 for every point</text><text x="125" y="93" text-anchor="middle" class="n">fit actual geometry extent</text></g>
  <g transform="translate(600 390)"><rect width="250" height="120" rx="20" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="125" y="42" text-anchor="middle" class="s">Navigation state</text><text x="125" y="68" text-anchor="middle" class="n">progress · ETA · maneuver</text><text x="125" y="93" text-anchor="middle" class="n">reroute / arrival</text></g>
  <path d="M1345 270 V340 H1075 V390" class="l"/><path d="M950 450 H850" class="l"/>
  <text x="750" y="565" text-anchor="middle" class="n">Current scope: exact route order for ≤8 destinations; no closed-tour TSP and no public deployment claim.</text>
</svg>
